[project]
name = "agno-datascience"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "krishnatiwari005", email = "krishna.08072005@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "agno>=3.0.11",
    "duckdb>=1.5.5",
    "fastapi[standard]>=0.141.1",
    "groq>=1.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openai>=3.19.2",
    "pandas>=3.0.6",
    "pip>=26.2.1",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
agno-datascience = "agno_datascience:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
